[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Never cache the HTML shell, so every visit picks up the latest asset file names.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed assets never change; cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A missing asset must be a real 404, not index.html (which the browser can't run as a script).
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Single-page app: let React Router handle every other path (e.g. /projects/p-at/sprints/...).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
