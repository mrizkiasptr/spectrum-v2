<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPEctrum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #boot { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #2D2D2D; background: #F9F9F9; }
      #boot .card { max-width: 520px; background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 28px; }
      #boot h1 { margin: 0 0 8px; font-size: 20px; }
      #boot p { margin: 0 0 12px; color: #5C6068; line-height: 1.5; }
      #boot code { display: block; font-size: 12px; background: #F3F4F6; padding: 8px 10px; border-radius: 6px; overflow-wrap: anywhere; margin-bottom: 14px; }
      #boot button { height: 40px; padding: 0 16px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; margin-left: 8px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status"><div class="card"><h1>Loading SPEctrum…</h1></div></div>
    </div>
    <script>
      // If the app fails to start (script failed to load, crash before render), show why instead of a blank page.
      (function () {
        var errors = [];
        function capture(msg) {
          // Web fonts are optional; a blocked font never stops the app.
          if (!msg || /fonts\.(googleapis|gstatic)\.com/.test(msg) || errors.length >= 5) return;
          errors.push(String(msg));
        }
        window.addEventListener('error', function (e) {
          capture(e.message || (e.target && (e.target.src || e.target.href) ? 'Failed to load ' + (e.target.src || e.target.href) : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { capture(e.reason && e.reason.message ? e.reason.message : e.reason); });
        function fail() {
          if (window.__spectrumMounted) return;
          var boot = document.getElementById('boot');
          if (!boot) return;
          boot.setAttribute('role', 'alert');
          boot.innerHTML =
            '<div class="card"><h1>SPEctrum didn’t start</h1>' +
            '<p>Reload the page. If it keeps happening, reset the data saved in this browser.</p>' +
            '<code></code><div style="text-align:right">' +
            '<button type="button" id="boot-reset" style="border:1px solid rgba(217,45,32,.3);background:#fff;color:#B42318">Reset data and reload</button>' +
            '<button type="button" id="boot-reload" style="border:0;background:#0779E4;color:#fff">Reload</button></div></div>';
          boot.querySelector('code').textContent = errors.join('\n') || 'The app script did not run. Check that the site was built (publish directory: dist).';
          document.getElementById('boot-reload').onclick = function () { location.reload(); };
          document.getElementById('boot-reset').onclick = function () {
            try { localStorage.removeItem('spectrum-v2'); } catch (e) {}
            location.assign('/projects');
          };
        }
        window.addEventListener('load', function () { setTimeout(fail, 4000); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
